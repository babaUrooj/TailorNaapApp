
name: Build installable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check project ZIP
        run: test -f TailorNaapApp_Project.zip

      - name: Extract Android project
        run: unzip -o TailorNaapApp_Project.zip -d extracted

      - name: Build debug APK
        working-directory: extracted/TailorNaapApp
        run: gradle assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Tailor-Naap-Book-APK
          path: extracted/TailorNaapApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
